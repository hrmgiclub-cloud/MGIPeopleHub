<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening PeopleHub…</title>
<script>
  /* Paste your PeopleHub web app link (the staff app link, ending in /exec) between the quotes. */
  const PEOPLEHUB_URL = '';
  if (PEOPLEHUB_URL) location.replace(PEOPLEHUB_URL.replace(/\/+$/, '') + '');
</script>
<style>
  :root{color-scheme:light dark;--ink:#1C2B30;--paper:#F7FAF9;--teal:#17424C}
  @media (prefers-color-scheme:dark){:root{--ink:#E6EFED;--paper:#0E1A1C;--teal:#7FC6C2}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.5 'Segoe UI',Arial,sans-serif;text-align:center;padding:24px}
  a{color:var(--teal);font-weight:700}
</style>
</head>
<body>
  <p id="msg">Opening the staff app…</p>
  <script>
    if (!PEOPLEHUB_URL) document.getElementById('msg').innerHTML = 'Setup needed: paste your PeopleHub link into PEOPLEHUB_URL in <b>app/index.html</b>.';
    else document.getElementById('msg').innerHTML = 'Opening the staff app… If nothing happens, <a href="' + PEOPLEHUB_URL.replace(/\/+$/, '') + '">tap here</a>.';
  </script>
</body>
</html>
