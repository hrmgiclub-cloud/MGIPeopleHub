<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script>
  /* ============ THE ONLY SETTING TO CHANGE ============
     Paste your PeopleHub web app link (the staff app link, ending in /exec) between the quotes. */
  const PEOPLEHUB_URL = 'https://script.google.com/macros/s/AKfycbx5TjitJ64Qmj3Mc8ozdoRLTnsiBfbWS3oZPcchuk2c98bw0GFaA3DOh9MuXT0vlpBl8g/exec';
</script>
<style>
:root{
  --teal:#17424C; --teal-2:#21606D; --mint:#E3F1EE; --sun:#F2B705; --ink:#1C2B30; --mute:#5A6B70;
  --paper:#F7FAF9; --surface:#FFFFFF; --line:#D5E3E0; --tile:#FFFFFF; --tile-hover:#F0F8F6;
  --head:'Bricolage Grotesque','Segoe UI',Arial,sans-serif; --body:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --teal:#7FC6C2; --teal-2:#A6DCD8; --mint:#12302F; --sun:#F5C542; --ink:#E6EFED; --mute:#9DB2B0;
  --paper:#0E1A1C; --surface:#152427; --line:#26393C; --tile:#18292C; --tile-hover:#1E3337; color-scheme:dark;}}
:root[data-theme="dark"]{--teal:#7FC6C2;--teal-2:#A6DCD8;--mint:#12302F;--sun:#F5C542;--ink:#E6EFED;--mute:#9DB2B0;--paper:#0E1A1C;--surface:#152427;--line:#26393C;--tile:#18292C;--tile-hover:#1E3337;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:18px 0}
.bar img{height:44px;width:auto;max-width:180px;object-fit:contain}
.bar .name{font:700 18px/1.2 var(--head);color:var(--teal)}
.bar .name small{display:block;font:400 13px/1.3 var(--body);color:var(--mute)}
/* hero = the actions */
.hero{background:var(--mint);border-radius:28px;padding:34px 30px 30px;margin-top:6px}
.hello{font:500 16px/1.3 var(--body);color:var(--mute);margin:0 0 6px}
.hero h1{font:800 clamp(30px,5.4vw,52px)/1.02 var(--head);letter-spacing:-.02em;color:var(--teal);margin:0 0 6px;max-width:16ch}
.hero p.welcome{margin:10px 0 24px;max-width:60ch;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:92px;padding:14px}.tile .lb{font-size:15px}}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:104px;padding:16px;background:var(--tile);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.tile:hover{background:var(--tile-hover);border-color:var(--teal-2)}
.tile .ic{font-size:28px;line-height:1}
.tile .lb{font:700 16px/1.25 var(--head)}
.tile.primary{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.primary{color:#0E1A1C}}
:root[data-theme="dark"] .tile.primary{color:#0E1A1C}
.tile.primary:hover{background:var(--teal-2)}
/* the one bold moment: next holiday */
.holiday{display:grid;grid-template-columns:auto 1fr;gap:4px 22px;align-items:center;margin:26px 0 8px;padding:22px 26px;border-left:10px solid var(--sun);background:var(--surface);border-radius:4px 22px 22px 4px}
.holiday .days{grid-row:span 2;font:800 clamp(54px,9vw,88px)/.9 var(--head);color:var(--ink);letter-spacing:-.04em}
.holiday .days small{display:block;font:500 15px/1.2 var(--body);letter-spacing:0;color:var(--mute);margin-top:6px}
.holiday h2{font:700 22px/1.2 var(--head);margin:0}
.holiday p{margin:0;color:var(--mute)}
/* sections */
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:34px;margin:34px 0 10px}
@media (max-width:820px){.cols{grid-template-columns:1fr;gap:26px}.hero{padding:26px 20px 22px;border-radius:22px}}
h3{font:700 21px/1.2 var(--head);color:var(--teal);margin:0 0 12px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:14px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:4px}
.news b{display:block;font:700 17px/1.3 var(--head)}
.news .when{font-size:14px;color:var(--mute)}
.news p{margin:6px 0 0;white-space:pre-line;max-width:70ch}
.hols{list-style:none;margin:0 0 26px;padding:0}
.hols li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.hols li:first-child{border-top:0}
.hols .d{min-width:104px;font-weight:700}
.docs{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.docs a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.docs a:hover{border-color:var(--teal-2)}
.contact{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.contact div{margin:4px 0}
.empty{color:var(--mute);margin:0}
.notice{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:#FFF4CC;color:#5C4500;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{background:#3A2F07;color:#F5DE8A}}
footer{margin:40px 0 30px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.tile{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><img id="logo" alt="" hidden><div class="name" id="company">HR Portal<small id="appname">PeopleHub</small></div></header>
  <section class="hero" aria-labelledby="h1">
    <p class="hello" id="hello">Hello</p>
    <h1 id="h1">What do you need today?</h1>
    <p class="welcome" id="welcome"></p>
    <nav class="tiles" id="tiles" aria-label="Quick actions"></nav>
    <p class="notice" id="notice" hidden></p>
  </section>
  <section class="holiday" id="nexthol" hidden aria-label="Next holiday">
    <div class="days" id="hdays"></div><h2 id="hname"></h2><p id="hdate"></p>
  </section>
  <div class="cols">
    <section aria-labelledby="newsh"><h3 id="newsh">HR news</h3><ul class="news" id="news"><li><p class="empty">Loading…</p></li></ul></section>
    <aside>
      <h3>Holidays</h3><ul class="hols" id="hols"></ul>
      <h3>Policies and documents</h3><div class="docs" id="docs"></div>
      <h3>Hours and contact</h3><div class="contact" id="contact"></div>
    </aside>
  </div>
  <footer><span id="updated"></span><span>Your personal records, leave and payslips stay inside PeopleHub (log in required).</span></footer>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var h = new Date().getHours(); $('hello').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', and welcome.';
  var SAMPLE = { company: 'Your company', app: 'PeopleHub', welcome: 'Apply for leave, overtime and claims, see your payslips and the latest HR news.', hours: 'Mon-Fri 11:00 AM - 8:00 PM', hrEmail: 'hr@example.com', hrPhone: '',
    links: [{ section: 'Quick', label: 'Log in to PeopleHub', icon: '\uD83D\uDD11', url: '#' }, { section: 'Quick', label: 'Apply for leave', icon: '\uD83C\uDF34', url: '#' }, { section: 'Quick', label: 'Payslips', icon: '\uD83D\uDCB0', url: '#' }, { section: 'Quick', label: 'Clock in', icon: '\uD83D\uDCCD', url: '#' }, { section: 'Documents', label: 'Leave policy', icon: '\uD83D\uDCD8', url: '#' }],
    announcements: [{ title: 'Sample announcement', date: 'Today', message: 'Connect this page to PeopleHub to show your real announcements.' }], holidays: [{ date: '8 Dec 2026', day: 'Tue', name: 'Feast of the Immaculate Conception' }, { date: '25 Dec 2026', day: 'Fri', name: 'Christmas Day' }] };
  function draw(d, sample) {
    document.title = (d.company ? d.company + ' - ' : '') + 'HR Portal';
    $('company').innerHTML = esc(d.company || 'HR Portal') + '<small>HR Portal &middot; ' + esc(d.app || 'PeopleHub') + '</small>';
    if (d.logo) { $('logo').src = d.logo; $('logo').alt = d.company || ''; $('logo').hidden = false; }
    $('welcome').textContent = d.welcome || '';
    var q = (d.links || []).filter(function (l) { return l.section !== 'Documents'; }), docs = (d.links || []).filter(function (l) { return l.section === 'Documents'; });
    $('tiles').innerHTML = q.map(function (l, i) { return '<a class="tile' + (i === 0 ? ' primary' : '') + '" href="' + esc(l.url) + '" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">' + esc(l.icon || '\u2022') + '</span><span class="lb">' + esc(l.label) + '</span></a>'; }).join('') || '<p class="empty">No buttons yet - add them in PeopleHub (Portal links).</p>';
    $('docs').innerHTML = docs.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener"><span aria-hidden="true">' + esc(l.icon || '\uD83D\uDCC4') + '</span>' + esc(l.label) + '</a>'; }).join('') || '<p class="empty">No documents yet.</p>';
    var A = d.announcements || []; $('news').innerHTML = A.length ? A.map(function (a) { return '<li><b>' + esc(a.title) + '</b><span class="when">' + esc(a.date) + '</span><p>' + esc(a.message) + '</p></li>'; }).join('') : '<li><p class="empty">No news right now.</p></li>';
    var H = d.holidays || []; $('hols').innerHTML = H.length ? H.map(function (x) { return '<li><span class="d">' + esc(x.day + ' ' + x.date) + '</span><span>' + esc(x.name) + '</span></li>'; }).join('') : '<li><span class="empty">None coming up.</span></li>';
    if (H.length) { var nd = new Date(H[0].date + ' 12:00'), t = new Date(); t.setHours(12, 0, 0, 0); var n = isNaN(nd) ? null : Math.round((nd - t) / 864e5);
      if (n !== null && n >= 0) { $('hdays').innerHTML = (n === 0 ? 'Today' : n) + '<small>' + (n === 0 ? '' : n === 1 ? 'day to go' : 'days to go') + '</small>'; $('hname').textContent = H[0].name; $('hdate').textContent = H[0].day + ', ' + H[0].date; $('nexthol').hidden = false; } }
    $('contact').innerHTML = (d.hours ? '<div><b>Working hours</b><br>' + esc(d.hours) + '</div>' : '') + (d.hrEmail ? '<div><b>Email HR</b><br><a href="mailto:' + esc(d.hrEmail) + '">' + esc(d.hrEmail) + '</a></div>' : '') + (d.hrPhone ? '<div><b>Call HR</b><br><a href="tel:' + esc(String(d.hrPhone).replace(/[^\d+]/g, '')) + '">' + esc(d.hrPhone) + '</a></div>' : '');
    $('updated').textContent = sample ? 'Sample content - not connected to PeopleHub yet.' : (d.updated ? 'Updated ' + d.updated : '');
  }
  if (!PEOPLEHUB_URL) { draw(SAMPLE, true); $('notice').hidden = false; $('notice').textContent = 'Setup needed: paste your PeopleHub link into PEOPLEHUB_URL at the top of index.html.'; return; }
  var url = PEOPLEHUB_URL.replace(/\/+$/, '') + (PEOPLEHUB_URL.indexOf('?') > -1 ? '&' : '?') + 'feed=portal';
  fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) { draw(d, false); })
    .catch(function () { draw(SAMPLE, true); $('notice').hidden = false; $('notice').textContent = 'Could not load the latest HR information. Check the PeopleHub link in index.html, and that the web app is deployed for "Anyone".'; });
})();
</script>
</body>
</html>
